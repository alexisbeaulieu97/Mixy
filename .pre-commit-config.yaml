repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.12.5
          - types-pyyaml>=6.0.12.20250915
          - loguru>=0.7.3
          - typer>=0.24.1
          - jinja2>=3.1.6
          - platformdirs>=4.9.4
          - pluggy>=1.4
          - pygit2>=1.14
          - anyio>=4.0
