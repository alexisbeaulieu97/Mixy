[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "mixy"
version = "0.1.0"
description = "CLI for composing and generating projects from one or more templates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "platformdirs>=4.9.4",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "typer>=0.24.1",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
    "types-pyyaml>=6.0.12.20250915",
]

[project.scripts]
mixy = "mixy.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["mixy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mixy"]

[tool.pytest.ini_options]
addopts = "--cov=mixy --cov-report=term-missing"
testpaths = ["tests"]
